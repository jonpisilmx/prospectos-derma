<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospectos Derma Puerto Escondido | Agencia Reinventa</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    :root {
      --bg-color: #EAE4D7;
      --card-bg: #F6F3EC;
      --card-alt: #E5DEC9;
      --text-main: #141414;
      --border-color: #141414;
      --accent-green: #E8F588;
      --accent-orange: #E85D24;
      --accent-blue: #BAE6FD;
      --white: #FFFFFF;
      --radius: 18px;
      --shadow: 4px 4px 0px #141414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 28px; min-height: 100vh; }

    .container { max-width: 1300px; margin: 0 auto; }

    /* Header Estilo Editorial */
    header {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 22px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.35rem; letter-spacing: -0.5px; }
    .brand-badge { background: var(--accent-green); padding: 8px 16px; border: 1.5px solid var(--border-color); border-radius: 50px; font-size: 0.85rem; font-weight: 700; box-shadow: 2px 2px 0px var(--border-color); }

    /* ==========================================
       NUEVA ZONA SUPERIOR: CONTADOR + ÍNDICE RAPIDO
       ========================================== */
    .overview-strip {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .overview-strip { grid-template-columns: 1fr; } }

    .kpi-card {
      background: var(--accent-green);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kpi-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kpi-number {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .index-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .index-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .index-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .index-hint { font-size: 0.78rem; color: #555; font-weight: 500; }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 135px;
      overflow-y: auto;
      padding: 2px;
    }

    .prospect-pill {
      border: 1.5px solid var(--border-color);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .prospect-pill:hover {
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px var(--border-color);
    }
    .prospect-pill:active {
      transform: translateY(0);
      box-shadow: 1px 1px 0px var(--border-color);
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-color);
      flex-shrink: 0;
    }

    /* Layout principal */
    .dashboard-grid { display: grid; grid-template-columns: 380px 1fr; gap: 28px; }
    @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }

    /* Paneles / Tarjetas */
    .panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 1.25rem; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; font-weight: 700; }

    /* Formulario de alta rápida */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--white);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-orange); box-shadow: 2px 2px 0px var(--border-color); }
    
    .btn {
      background: var(--text-main);
      color: var(--white);
      border: 1.5px solid var(--border-color);
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: transform 0.1s ease, background 0.2s;
    }
    .btn:hover { background: var(--accent-orange); color: var(--text-main); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); box-shadow: 1px 1px 0px var(--border-color); }
    
    .btn-export { background: var(--accent-green); color: var(--text-main); margin-top: 16px; }
    .btn-export:hover { background: #dff065; }

    /* Filtros y Buscador */
    .filters-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .search-box { flex: 1; min-width: 240px; }

    /* Lista de Prospectos (Estilo Tarjeta Amplia tipo Player/Dashboard) */
    .prospects-list { display: flex; flex-direction: column; gap: 24px; max-height: 78vh; overflow-y: auto; padding-right: 6px; scroll-behavior: smooth; }
    
    .prospect-card {
      background: var(--white);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      box-shadow: 4px 4px 0px var(--border-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.3s ease;
    }
    @media (max-width: 768px) { .prospect-card { grid-template-columns: 1fr; } }
    .prospect-card:hover { transform: translateY(-2px); box-shadow: 5px 6px 0px var(--border-color); }

    /* Efecto de resaltado al hacer clic desde el índice superior */
    .prospect-card.highlight-card {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 4px rgba(232, 93, 36, 0.35), 4px 4px 0px var(--border-color);
    }

    /* Secciones Internas de la Tarjeta */
    .card-section-main { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #eee; padding-bottom: 14px; }
    @media (max-width: 768px) { .card-section-main { grid-column: span 1; flex-direction: column; align-items: flex-start; gap: 12px; } }

    .prospect-name-input {
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      color: var(--text-main);
    }
    .prospect-name-input:focus { background: var(--card-bg); border-radius: 8px; padding: 4px 8px; }

    /* Campos de Contacto y Estatus */
    .card-block { display: flex; flex-direction: column; gap: 8px; }
    .card-block label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #555; font-weight: 700; }
    
    .contact-input { font-size: 0.9rem; padding: 10px 14px; border-radius: 10px; background: var(--card-bg); border: 1.5px solid var(--border-color); }
    .contact-input:focus { background: var(--white); }

    .status-select { font-size: 0.9rem; font-weight: 600; padding: 10px 14px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--border-color); }

    /* Bloque de Notas Extendido */
    .card-block-full { grid-column: span 2; display: flex; flex-direction: column; gap: 8px; }
    @media (max-width: 768px) { .card-block-full { grid-column: span 1; } }

    .notes-textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.5;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .notes-textarea:focus { background: var(--white); box-shadow: 2px 2px 0px var(--border-color); }

    /* Botones de Acción inferiores */
    .card-actions-bar { grid-column: span 2; display: flex; justify-content: flex-end; gap: 10px; border-top: 1.5px solid #eee; padding-top: 14px; align-items: center; }
    @media (max-width: 768px) { .card-actions-bar { grid-column: span 1; flex-wrap: wrap; } }

    .icon-btn {
      background: var(--card-alt);
      border: 1.5px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }
    .icon-btn:hover { background: #ffc4b4; transform: translateY(-1px); }
    
    .whatsapp-btn {
      background: #25D366;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }
    .whatsapp-btn:hover { background: #20ba5a; transform: translateY(-1px); }

    /* Paleta de colores distintivos por Estatus (Aplica a Selects y Pills superiores) */
    .status-nuevo { background-color: #E2E8F0; }
    .status-datos { background-color: #FEF08A; }
    .status-propuesta-hecha { background-color: #FED7AA; }
    .status-propuesta-enviada { background-color: #BAE6FD; }
    .status-espera { background-color: #DDD6FE; }
    .status-cita { background-color: #BBF7D0; }
    .status-no { background-color: #FECACA; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <i data-feather="crosshair" style="width:26px;height:26px;"></i>
        <span>Prospectos Derma Puerto Escondido</span>
      </div>
      <div class="brand-badge">Agencia Reinventa</div>
    </header>

    <!-- NUEVA ZONA SUPERIOR: Contador Total + Índice de Prospectos con Código de Color -->
    <section class="overview-strip">
      <div class="kpi-card">
        <span class="kpi-label"><i data-feather="database" style="width:14px;height:14px;"></i> Registros Totales</span>
        <div class="kpi-number" id="totalRecordsCount">0</div>
      </div>

      <div class="index-card">
        <div class="index-header">
          <span class="index-title"><i data-feather="layers" style="width:14px;height:14px;"></i> Directorio Rápido por Estatus</span>
          <span class="index-hint">Haz clic en un nombre para ir directo a su ficha</span>
        </div>
        <div class="pills-container" id="prospectsIndexPills">
          <span style="font-size: 0.85rem; color: #666;">Cargando índice...</span>
        </div>
      </div>
    </section>

    <div class="dashboard-grid">
      <!-- Panel Izquierdo: Dar de alta nuevo prospecto -->
      <div class="panel">
        <h2><i data-feather="user-plus"></i> Nuevo Prospecto</h2>
        <form id="addProspectForm">
          <div class="form-group">
            <label for="name">Nombre / Clínica / Doctor(a)</label>
            <input type="text" id="name" placeholder="Ej. Dra. Sofía Valenzuela" required>
          </div>
          <div class="form-group">
            <label for="phone">Teléfono Convencional</label>
            <input type="text" id="phone" placeholder="954 123 4567">
          </div>
          <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" placeholder="+52 954 123 4567">
          </div>
          <div class="form-group">
            <label for="notes">Notas Iniciales</label>
            <textarea id="notes" rows="3" placeholder="Interés en pautas de Meta, diseño y redes sociales..."></textarea>
          </div>
          <button type="submit" class="btn">
            <i data-feather="plus-circle"></i> Agregar a Firestore
          </button>
        </form>
        <button onclick="exportToCSV()" class="btn btn-export">
          <i data-feather="download"></i> Exportar a CSV / Sheets
        </button>
      </div>

      <!-- Panel Derecho: Listado y Gestión -->
      <div class="panel">
        <div class="filters-bar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o nota..." oninput="filterProspects()">
          </div>
          <select id="statusFilter" onchange="filterProspects()" style="max-width: 240px;">
            <option value="todos">Todos los estatus</option>
            <option value="Nuevo registro">Nuevo registro</option>
            <option value="Ya se tienen todos los datos de contacto">Ya se tienen datos</option>
            <option value="Ya se hizo auditoría o propuesta">Auditoría hecha</option>
            <option value="Ya se envió auditoría o propuesta">Auditoría enviada</option>
            <option value="Ya tuvimos primer contestación, en espera">En espera de respuesta</option>
            <option value="Ya se hizo cita">Cita agendada</option>
            <option value="No desea los servicios">No desea servicios</option>
          </select>
        </div>

        <div id="prospectsList" class="prospects-list">
          <!-- Se cargan dinámicamente desde Firestore -->
          <p style="text-align: center; color: #666; padding: 40px;">Conectando con la base de datos de Google...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE FIREBASE (Tus llaves activas intactas)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBvLIJ1FN8a7_SXIrr1KcoPk8PpFWW-yvQ",
      authDomain: "reventadelta-prospectos.firebaseapp.com",
      projectId: "reventadelta-prospectos",
      storageBucket: "reventadelta-prospectos.appspot.com",
      messagingSenderId: "665683758285",
      appId: "1:665683758285:web:937ab25e61560eb6f26d84"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allProspects = [];

    const statusOptions = [
      "Nuevo registro",
      "Ya se tienen todos los datos de contacto",
      "Ya se hizo auditoría o propuesta",
      "Ya se envió auditoría o propuesta",
      "Ya tuvimos primer contestación, en espera",
      "Ya se hizo cita",
      "No desea los servicios"
    ];

    // Cargar datos en tiempo real desde Firestore
    db.collection("prospectos_derma_pe").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      allProspects = [];
      snapshot.forEach((doc) => {
        allProspects.push({ id: doc.id, ...doc.data() });
      });
      
      // Actualizar contador total y directorio rápido superior
      renderOverviewBar(allProspects);
      
      // Mantener filtros activos si el usuario está buscando algo
      filterProspects();
      feather.replace();
    });

    // Renderizar Contador Grande y Etiquetas de Navegación Rápida
    function renderOverviewBar(prospects) {
      const countEl = document.getElementById('totalRecordsCount');
      const pillsContainer = document.getElementById('prospectsIndexPills');
      
      countEl.textContent = prospects.length;

      if (prospects.length === 0) {
        pillsContainer.innerHTML = `<span style="font-size: 0.85rem; color: #666;">Aún no hay prospectos en la base de datos.</span>`;
        return;
      }

      pillsContainer.innerHTML = prospects.map(p => `
        <button type="button" 
                class="prospect-pill ${getStatusClass(p.status)}" 
                onclick="jumpToProspect('${p.id}')"
                title="Estatus: ${escapeHtml(p.status || 'Nuevo registro')}">
          <span class="pill-dot"></span>
          ${escapeHtml(p.name || 'Sin nombre')}
        </button>
      `).join('');
    }

    // Desplazarse al registro seleccionado y resaltarlo
    function jumpToProspect(id) {
      // Si hay un filtro activo que oculta la tarjeta, lo limpiamos para garantizar que aparezca
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      
      if (searchInput.value !== '' || statusFilter.value !== 'todos') {
        searchInput.value = '';
        statusFilter.value = 'todos';
        renderProspects(allProspects);
      }

      setTimeout(() => {
        const card = document.getElementById(`card-${id}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('highlight-card');
          setTimeout(() => {
            card.classList.remove('highlight-card');
          }, 1800);
        }
      }, 60);
    }

    // Agregar nuevo prospecto
    document.getElementById('addProspectForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const notes = document.getElementById('notes').value;

      db.collection("prospectos_derma_pe").add({
        name,
        phone,
        whatsapp,
        notes,
        status: "Nuevo registro",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('addProspectForm').reset();
      }).catch((error) => {
        alert("Error al guardar: " + error.message);
      });
    });

    // Renderizar prospectos con diseño tipo Card de Dashboard Amplio
    function renderProspects(prospects) {
      const container = document.getElementById('prospectsList');
      if (prospects.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #666; padding: 40px;">No se encontraron prospectos con ese filtro.</p>`;
        return;
      }

      container.innerHTML = prospects.map(p => `
        <div class="prospect-card" id="card-${p.id}">
          <!-- Cabecera de la tarjeta: Nombre editable -->
          <div class="card-section-main">
            <input type="text" class="prospect-name-input" value="${escapeHtml(p.name || '')}" placeholder="Nombre del prospecto o clínica..." onchange="updateField('${p.id}', 'name', this.value)">
          </div>
          
          <!-- Bloque 1: Datos de Contacto -->
          <div class="card-block">
            <label>Teléfono Convencional</label>
            <input type="text" class="contact-input" value="${escapeHtml(p.phone || '')}" placeholder="954 123 4567" onchange="updateField('${p.id}', 'phone', this.value)">
          </div>

          <div class="card-block">
            <label>WhatsApp</label>
            <input type="text" class="contact-input" value="${escapeHtml(p.whatsapp || '')}" placeholder="+52 954 123 4567" onchange="updateField('${p.id}', 'whatsapp', this.value)">
          </div>

          <!-- Bloque 2: Estatus comercial -->
          <div class="card-block" style="grid-column: span 2;">
            <label>Estatus Actual del Proceso</label>
            <select class="status-select ${getStatusClass(p.status)}" onchange="updateStatus('${p.id}', this.value)">
              ${statusOptions.map(opt => `<option value="${opt}" ${p.status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </div>

          <!-- Bloque 3: Notas amplias y cómodas -->
          <div class="card-block-full">
            <label>Bitácora de Notas y Seguimiento</label>
            <textarea class="notes-textarea" placeholder="Escribe aquí notas detalladas, acuerdos, fechas de llamadas o pendientes..." onchange="updateField('${p.id}', 'notes', this.value)">${escapeHtml(p.notes || '')}</textarea>
          </div>

          <!-- Barra de Acciones inferior -->
          <div class="card-actions-bar">
            ${p.whatsapp ? `<a href="https://wa.me/${p.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="whatsapp-btn"><i data-feather="message-circle" style="width:16px;height:16px"></i> Abrir WhatsApp</a>` : ''}
            <button class="icon-btn" onclick="deleteProspect('${p.id}')" style="color: #b91c1c;"><i data-feather="trash-2" style="width:16px;height:16px"></i> Eliminar</button>
          </div>
        </div>
      `).join('');
      feather.replace();
    }

    // Actualizar campo individual
    function updateField(id, field, value) {
      db.collection("prospectos_derma_pe").doc(id).update({
        [field]: value
      });
    }

    // Actualizar estatus
    function updateStatus(id, newStatus) {
      db.collection("prospectos_derma_pe").doc(id).update({
        status: newStatus
      });
    }

    // Eliminar registro
    function deleteProspect(id) {
      if (confirm("¿Estás seguro de eliminar este prospecto?")) {
        db.collection("prospectos_derma_pe").doc(id).delete();
      }
    }

    // Filtrar prospectos en tiempo real
    function filterProspects() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = allProspects.filter(p => {
        const matchesSearch = (p.name && p.name.toLowerCase().includes(search)) || (p.notes && p.notes.toLowerCase().includes(search));
        const matchesStatus = statusFilter === 'todos' || p.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      renderProspects(filtered);
    }

    // Asignar clases de color según estatus
    function getStatusClass(status) {
      switch(status) {
        case 'Nuevo registro': return 'status-nuevo';
        case 'Ya se tienen todos los datos de contacto': return 'status-datos';
        case 'Ya se hizo auditoría o propuesta': return 'status-propuesta-hecha';
        case 'Ya se envió auditoría o propuesta': return 'status-propuesta-enviada';
        case 'Ya tuvimos primer contestación, en espera': return 'status-espera';
        case 'Ya se hizo cita': return 'status-cita';
        case 'No desea los servicios': return 'status-no';
        default: return 'status-nuevo';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Exportar a CSV (compatible directo con Google Sheets)
    function exportToCSV() {
      let csv = 'Nombre,Telefono,WhatsApp,Estatus,Notas\n';
      allProspects.forEach(p => {
        csv += `"${p.name || ''}","${p.phone || ''}","${p.whatsapp || ''}","${p.status || ''}","${(p.notes || '').replace(/\n/g, ' ')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "prospectos_derma_puerto_escondido.csv";
      link.click();
    }

    feather.replace();
  </script>
</body>
