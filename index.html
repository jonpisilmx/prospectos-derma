<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospectos Derma Puerto Escondido | Agencia Reinventa</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    :root {
      --bg-color: #EAE4D7;
      --card-bg: #F6F3EC;
      --card-alt: #E5DEC9;
      --text-main: #141414;
      --border-color: #141414;
      --accent-green: #E8F588;
      --accent-orange: #E85D24;
      --white: #FFFFFF;
      --radius: 16px;
      --shadow: 4px 4px 0px #141414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; min-height: 100vh; }

    .container { max-width: 1200px; margin: 0 auto; }

    /* Header */
    header {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; }
    .brand-badge { background: var(--accent-green); padding: 6px 12px; border: 1.5px solid var(--border-color); border-radius: 50px; font-size: 0.85rem; }

    /* Layout principal */
    .dashboard-grid { display: grid; grid-template-columns: 350px 1fr; gap: 24px; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

    /* Paneles / Tarjetas Neo-Bento */
    .panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 1.15rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* Formulario de alta rápida */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--white);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-orange); }
    
    .btn {
      background: var(--text-main);
      color: var(--white);
      border: 1.5px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn:hover { background: var(--accent-orange); color: var(--text-main); }
    .btn-export { background: var(--accent-green); color: var(--text-main); margin-top: 12px; }

    /* Filtros y Estadísticas */
    .filters-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .search-box { flex: 1; min-width: 200px; }

    /* Lista de Prospectos */
    .prospects-list { display: flex; flex-direction: column; gap: 16px; max-height: 75vh; overflow-y: auto; padding-right: 4px; }
    
    .prospect-card {
      background: var(--white);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1.2fr auto;
      gap: 16px;
      align-items: center;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.2s;
    }
    @media (max-width: 768px) { .prospect-card { grid-template-columns: 1fr; } }
    .prospect-card:hover { transform: translateY(-2px); }

    .prospect-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .prospect-info p { font-size: 0.85rem; color: #555; }

    .contact-fields { display: flex; flex-direction: column; gap: 6px; }
    .contact-input { font-size: 0.85rem; padding: 6px 10px; }

    /* Estatus Selectores */
    .status-select { font-size: 0.85rem; font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer; }
    
    .actions-col { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: var(--card-alt);
      border: 1.5px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--accent-green); }
    .whatsapp-btn { background: #25D366; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border-color); }

    /* Colores por Estatus */
    .status-nuevo { background-color: #E2E8F0; }
    .status-datos { background-color: #FEF08A; }
    .status-propuesta-hecha { background-color: #FED7AA; }
    .status-propuesta-enviada { background-color: #BAE6FD; }
    .status-espera { background-color: #DDD6FE; }
    .status-cita { background-color: #BBF7D0; }
    .status-no { background-color: #FECACA; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <i data-feather="crosshair"></i>
        <span>Prospectos Derma Puerto Escondido</span>
      </div>
      <div class="brand-badge">Agencia Reinventa</div>
    </header>

    <div class="dashboard-grid">
      <!-- Panel Izquierdo: Dar de alta nuevo prospecto -->
      <div class="panel">
        <h2><i data-feather="user-plus"></i> Nuevo Prospecto</h2>
        <form id="addProspectForm">
          <div class="form-group">
            <label for="name">Nombre / Clínica / Doctor(a)</label>
            <input type="text" id="name" placeholder="Ej. Dra. Sofía Valenzuela" required>
          </div>
          <div class="form-group">
            <label for="phone">Teléfono Convencional</label>
            <input type="text" id="phone" placeholder="954 123 4567">
          </div>
          <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" placeholder="+52 954 123 4567">
          </div>
          <div class="form-group">
            <label for="notes">Notas Iniciales</label>
            <textarea id="notes" rows="3" placeholder="Interés en pautas de Meta y redes sociales..."></textarea>
          </div>
          <button type="submit" class="btn">
            <i data-feather="plus-circle"></i> Agregar a Firestore
          </button>
        </form>
        <button onclick="exportToCSV()" class="btn btn-export">
          <i data-feather="download"></i> Exportar a CSV / Sheets
        </button>
      </div>

      <!-- Panel Derecho: Listado y Gestión -->
      <div class="panel">
        <div class="filters-bar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o nota..." oninput="filterProspects()">
          </div>
          <select id="statusFilter" onchange="filterProspects()" style="max-width: 220px;">
            <option value="todos">Todos los estatus</option>
            <option value="Nuevo registro">Nuevo registro</option>
            <option value="Ya se tienen todos los datos de contacto">Ya se tienen datos</option>
            <option value="Ya se hizo auditoría o propuesta">Auditoría hecha</option>
            <option value="Ya se envió auditoría o propuesta">Auditoría enviada</option>
            <option value="Ya tuvimos primer contestación, en espera">En espera de respuesta</option>
            <option value="Ya se hizo cita">Cita agendada</option>
            <option value="No desea los servicios">No desea servicios</option>
          </select>
        </div>

        <div id="prospectsList" class="prospects-list">
          <!-- Se cargan dinámicamente desde Firestore -->
          <p style="text-align: center; color: #666; padding: 20px;">Conectando con la base de datos de Google...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE FIREBASE (Tus llaves de proyecto)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBvLIJ1FN8a7_SXIrr1KcoPk8PpFWW-yvQ",
      authDomain: "reventadelta-prospectos.firebaseapp.com",
      projectId: "reventadelta-prospectos",
      storageBucket: "reventadelta-prospectos.appspot.com",
      messagingSenderId: "665683758285",
      appId: "1:665683758285:web:937ab25e61560eb6f26d84"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allProspects = [];

    const statusOptions = [
      "Nuevo registro",
      "Ya se tienen todos los datos de contacto",
      "Ya se hizo auditoría o propuesta",
      "Ya se envió auditoría o propuesta",
      "Ya tuvimos primer contestación, en espera",
      "Ya se hizo cita",
      "No desea los servicios"
    ];

    // Cargar datos en tiempo real desde Firestore
    db.collection("prospectos_derma_pe").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      allProspects = [];
      snapshot.forEach((doc) => {
        allProspects.push({ id: doc.id, ...doc.data() });
      });
      renderProspects(allProspects);
      feather.replace();
    });

    // Agregar nuevo prospecto
    document.getElementById('addProspectForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const notes = document.getElementById('notes').value;

      db.collection("prospectos_derma_pe").add({
        name,
        phone,
        whatsapp,
        notes,
        status: "Nuevo registro",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('addProspectForm').reset();
      }).catch((error) => {
        alert("Error al guardar: " + error.message);
      });
    });

    // Renderizar prospectos en pantalla
    function renderProspects(prospects) {
      const container = document.getElementById('prospectsList');
      if (prospects.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #666; padding: 20px;">No hay prospectos registrados todavía.</p>`;
        return;
      }

      container.innerHTML = prospects.map(p => `
        <div class="prospect-card">
          <div class="prospect-info">
            <h3>${escapeHtml(p.name)}</h3>
            <textarea class="contact-input" placeholder="Notas extra..." onchange="updateField('${p.id}', 'notes', this.value)">${escapeHtml(p.notes || '')}</textarea>
          </div>
          
          <div class="contact-fields">
            <input type="text" class="contact-input" value="${escapeHtml(p.phone || '')}" placeholder="Teléfono" onchange="updateField('${p.id}', 'phone', this.value)">
            <input type="text" class="contact-input" value="${escapeHtml(p.whatsapp || '')}" placeholder="WhatsApp" onchange="updateField('${p.id}', 'whatsapp', this.value)">
          </div>

          <div>
            <select class="status-select ${getStatusClass(p.status)}" onchange="updateStatus('${p.id}', this.value)">
              ${statusOptions.map(opt => `<option value="${opt}" ${p.status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </div>

          <div class="actions-col">
            ${p.whatsapp ? `<a href="https://wa.me/${p.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="whatsapp-btn" title="Abrir WhatsApp"><i data-feather="message-circle" style="width:18px;height:18px"></i></a>` : ''}
            <button class="icon-btn" onclick="deleteProspect('${p.id}')" title="Eliminar registro"><i data-feather="trash-2" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      `).join('');
      feather.replace();
    }

    // Actualizar campo individual (teléfono, whatsapp, notas)
    function updateField(id, field, value) {
      db.collection("prospectos_derma_pe").doc(id).update({
        [field]: value
      });
    }

    // Actualizar estatus
    function updateStatus(id, newStatus) {
      db.collection("prospectos_derma_pe").doc(id).update({
        status: newStatus
      });
    }

    // Eliminar registro
    function deleteProspect(id) {
      if (confirm("¿Estás seguro de eliminar este prospecto?")) {
        db.collection("prospectos_derma_pe").doc(id).delete();
      }
    }

    // Filtrar prospectos en tiempo real
    function filterProspects() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = allProspects.filter(p => {
        const matchesSearch = (p.name && p.name.toLowerCase().includes(search)) || (p.notes && p.notes.toLowerCase().includes(search));
        const matchesStatus = statusFilter === 'todos' || p.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      renderProspects(filtered);
    }

    // Asignar clases de color según estatus
    function getStatusClass(status) {
      switch(status) {
        case 'Nuevo registro': return 'status-nuevo';
        case 'Ya se tienen todos los datos de contacto': return 'status-datos';
        case 'Ya se hizo auditoría o propuesta': return 'status-propuesta-hecha';
        case 'Ya se envió auditoría o propuesta': return 'status-propuesta-enviada';
        case 'Ya tuvimos primer contestación, en espera': return 'status-espera';
        case 'Ya se hizo cita': return 'status-cita';
        case 'No desea los servicios': return 'status-no';
        default: return '';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Exportar a CSV (compatible directo con Google Sheets)
    function exportToCSV() {
      let csv = 'Nombre,Telefono,WhatsApp,Estatus,Notas\n';
      allProgress = allProspects || [];
      allProspects.forEach(p => {
        csv += `"${p.name || ''}","${p.phone || ''}","${p.whatsapp || ''}","${p.status || ''}","${(p.notes || '').replace(/\n/g, ' ')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "prospectos_derma_puerto_escondido.csv";
      link.click();
    }

    feather.replace();
  </script>
</body>
</html>
